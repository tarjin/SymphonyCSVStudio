<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX009 Equalizer</title>
<style>
body {
  background: #17202b;
  color: #f0f3f7;
  font: 16px system-ui;
  max-width: 600px;
  margin: 40px auto;
  padding: 16px;
}
h1 { color: #82cfff; }
label { display: block; margin: 22px 0; }
input[type=range] { width: 100%; }
button {
  padding: 12px 20px;
  margin-right: 8px;
  font-size: 16px;
  cursor: pointer;
}
#status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX009 — Three-Band Equalizer</h1>
<p>SymphonyCSV Studio — Tone-Shaping Laboratory</p>

<button id="play">Play Sustained C3</button>
<button id="reset">Reset EQ to Flat</button>

<label>
  Bass: <output id="lowValue">0</output> dB
  <input id="low" type="range"
    min="-18" max="12" step="1" value="0">
</label>

<label>
  Midrange: <output id="midValue">0</output> dB
  <input id="mid" type="range"
    min="-18" max="12" step="1" value="0">
</label>

<label>
  Treble: <output id="highValue">0</output> dB
  <input id="high" type="range"
    min="-18" max="12" step="1" value="0">
</label>

<label>
  Wet Mix: <output id="wetValue">1</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="1">
</label>

<label>
  <input id="bypass" type="checkbox"> Bypass EQ
</label>

<p id="status">Audio has not started.</p>
<p>Start with a low listening volume. Compare boost,
cut, flat settings, and bypass.</p>

<script type="module">
import { start, Synth } from "tone";
import { createEqualizer } from "../fx009-equalizer.js";

const status = document.querySelector("#status");
const play = document.querySelector("#play");

try {
  const fx = createEqualizer();
  fx.node.toDestination();

  const synth = new Synth({
    volume: -27,
    oscillator: { type: "sawtooth" },
    envelope: {
      attack: 0.04,
      decay: 0.2,
      sustain: 0.8,
      release: 0.5
    }
  }).connect(fx.node);

  play.addEventListener("click", async () => {
    try {
      await start();
      synth.triggerAttackRelease("C3", "2m");
      status.textContent =
        "Playing C3. Adjust bass, midrange and treble.";
    } catch (error) {
      status.textContent = "Audio error: " + error.message;
      console.error(error);
    }
  });

  const controls = [
    ["low", "setLow"],
    ["mid", "setMid"],
    ["high", "setHigh"],
    ["wet", "setWet"]
  ];

  for (const [id, method] of controls) {
    document.querySelector("#" + id)
      .addEventListener("input", event => {
        try {
          const value = event.target.value;
          fx[method](value);
          document.querySelector("#" + id + "Value")
            .textContent = value;
          status.textContent = "EQ settings updated.";
        } catch (error) {
          status.textContent = "Control error: " + error.message;
          console.error(error);
        }
      });
  }

  document.querySelector("#bypass")
    .addEventListener("change", event => {
      fx.setBypass(event.target.checked);
    });

  document.querySelector("#reset")
    .addEventListener("click", () => {
      for (const id of ["low", "mid", "high"]) {
        const slider = document.querySelector("#" + id);
        slider.value = 0;
        slider.dispatchEvent(new Event("input"));
      }
      status.textContent = "EQ reset to flat (0 dB).";
    });

} catch (error) {
  status.textContent =
    "Initialization error: " + error.message;
  play.disabled = true;
  console.error(error);
}
</script>
</body>
</html>
