<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SymphonyCSV Studio - FX002 Chorus</title>
  <style>
    body { background:#17202b; color:#f0f3f7;
           font:16px system-ui; margin:40px auto; max-width:560px; }
    h1 { color:#82cfff; }
    label { display:block; margin:22px 0; }
    input[type=range] { width:100%; }
    button { padding:14px 24px; font-size:18px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>FX002 — Chorus</h1>
  <p>SymphonyCSV Studio — Effects Laboratory</p>

  <button id="play">Play Sustained C4</button>

  <label>Modulation Rate:
    <output id="rateValue">1.5</output> Hz
    <input id="rate" type="range"
           min="0.2" max="6" step="0.1" value="1.5">
  </label>

  <label>Depth:
    <output id="depthValue">0.7</output>
    <input id="depth" type="range"
           min="0" max="1" step="0.05" value="0.7">
  </label>

  <label>Wet Mix:
    <output id="wetValue">0.7</output>
    <input id="wet" type="range"
           min="0" max="1" step="0.05" value="0.7">
  </label>

  <label>
    <input id="bypass" type="checkbox"> Bypass effect
  </label>

  <p id="status">Audio has not started.</p>

  <script type="module">
    import { start, Synth } from "tone";
    import { createChorus } from "../fx002-chorus.js";

    const fx = createChorus();
    fx.node.toDestination();

    const synth = new Synth({
      volume: -20,
      oscillator: { type: "sawtooth" },
      envelope: {
        attack: 0.04,
        decay: 0.2,
        sustain: 0.65,
        release: 0.6
      }
    }).connect(fx.node);

    document.querySelector("#play").addEventListener("click", async () => {
      try {
        await start();
        fx.start();
        synth.triggerAttackRelease("C4", "1m");
        document.querySelector("#status").textContent =
          "Sustained note playing. Listen for width and movement.";
      } catch (error) {
        document.querySelector("#status").textContent = error.message;
        console.error(error);
      }
    });

    for (const [id, method] of [
      ["rate", "setRate"],
      ["depth", "setDepth"],
      ["wet", "setWet"]
    ]) {
      document.querySelector("#" + id).addEventListener("input", (event) => {
        const value = event.target.value;
        fx[method](value);
        document.querySelector("#" + id + "Value").textContent = value;
      });
    }

    document.querySelector("#bypass").addEventListener("change", (event) => {
      fx.setBypass(event.target.checked);
    });
  </script>
</body>
</html>
