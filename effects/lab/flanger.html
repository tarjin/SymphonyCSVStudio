<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX005 Flanger</title>
<style>
  body {
    background: #17202b;
    color: #f0f3f7;
    font: 16px system-ui;
    max-width: 600px;
    margin: 40px auto;
    padding: 16px;
  }
  h1 { color: #82cfff; }
  label { display: block; margin: 22px 0; }
  input[type=range] { width: 100%; }
  button {
    padding: 14px 24px;
    font-size: 18px;
    cursor: pointer;
  }
  #status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX005 — Flanger</h1>
<p>SymphonyCSV Studio — Custom Effects Laboratory</p>

<button id="play">Play Sustained C3</button>

<label>
  Modulation Rate:
  <output id="rateValue">0.35</output> Hz
  <input id="rate" type="range"
    min="0.05" max="5" step="0.05" value="0.35">
</label>

<label>
  Modulation Depth:
  <output id="depthValue">0.8</output>
  <input id="depth" type="range"
    min="0" max="1" step="0.05" value="0.8">
</label>

<label>
  Feedback:
  <output id="feedbackValue">0.25</output>
  <input id="feedback" type="range"
    min="0" max="0.7" step="0.05" value="0.25">
</label>

<label>
  Wet Mix:
  <output id="wetValue">0.65</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="0.65">
</label>

<label>
  <input id="bypass" type="checkbox"> Bypass effect
</label>

<p id="status">Audio has not started.</p>

<p>
  Listen for a sweeping, swirling character.
  Compare low and high modulation rates.
</p>

<script type="module">
  import { start, Synth } from "tone";
  import { createFlanger } from "../fx005-flanger.js";

  const status = document.querySelector("#status");
  const play = document.querySelector("#play");

  try {
    const fx = createFlanger();
    fx.node.toDestination();

    const synth = new Synth({
      volume: -24,
      oscillator: { type: "sawtooth" },
      envelope: {
        attack: 0.05,
        decay: 0.2,
        sustain: 0.65,
        release: 0.6
      }
    }).connect(fx.node);

    play.addEventListener("click", async () => {
      try {
        await start();
        fx.start();
        synth.triggerAttackRelease("C3", "2m");
        status.textContent =
          "Playing sustained C3. Listen for the sweep.";
      } catch (error) {
        status.textContent = "Audio error: " + error.message;
        console.error(error);
      }
    });

    for (const [id, method] of [
      ["rate", "setRate"],
      ["depth", "setDepth"],
      ["feedback", "setFeedback"],
      ["wet", "setWet"]
    ]) {
      document.querySelector("#" + id)
        .addEventListener("input", event => {
          try {
            const value = event.target.value;
            fx[method](value);
            document.querySelector("#" + id + "Value")
              .textContent = value;
          } catch (error) {
            status.textContent = error.message;
            console.error(error);
          }
        });
    }

    document.querySelector("#bypass")
      .addEventListener("change", event => {
        fx.setBypass(event.target.checked);
      });

  } catch (error) {
    status.textContent =
      "Processor initialization error: " + error.message;
    play.disabled = true;
    console.error(error);
  }
</script>
</body>
</html>
