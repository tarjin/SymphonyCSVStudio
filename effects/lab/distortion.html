<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX016 Distortion</title>
<style>
body {
  background: #17202b;
  color: #f0f3f7;
  font: 16px system-ui;
  max-width: 620px;
  margin: 40px auto;
  padding: 16px;
}
h1 { color: #82cfff; }
label { display: block; margin: 24px 0; }
input[type=range] { width: 100%; }
button, select {
  padding: 12px 18px;
  font-size: 16px;
}
#status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX016 — Distortion</h1>
<p>SymphonyCSV Studio — Character Effects Laboratory</p>

<button id="play">Play Sustained C3</button>

<label>
  Distortion Amount:
  <output id="amountValue">0.35</output>
  <input id="amount" type="range"
    min="0" max="1" step="0.05" value="0.35">
</label>

<label>
  Wet Mix:
  <output id="wetValue">0.75</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="0.75">
</label>

<label>
  Oversampling:
  <select id="oversample">
    <option value="none">None</option>
    <option value="2x" selected>2x</option>
    <option value="4x">4x</option>
  </select>
</label>

<label>
  <input id="bypass" type="checkbox">
  Bypass distortion
</label>

<p id="status">Audio has not started.</p>

<p>
  Compare clean and distorted sounds.
  Increase distortion gradually and keep
  listening volume low.
</p>

<script type="module">
import { start, Synth } from "tone";
import { createDistortion } from "../fx016-distortion.js";

const status = document.querySelector("#status");
const play = document.querySelector("#play");

try {
  const fx = createDistortion();
  fx.node.toDestination();

  const synth = new Synth({
    volume: -30,
    oscillator: { type: "triangle" },
    envelope: {
      attack: 0.03,
      decay: 0.15,
      sustain: 0.75,
      release: 0.4
    }
  }).connect(fx.node);

  play.addEventListener("click", async () => {
    try {
      await start();
      synth.triggerAttackRelease("C3", "2m");
      status.textContent =
        "Playing C3. Listen for added harmonics.";
    } catch (error) {
      status.textContent =
        "Audio error: " + error.message;
      console.error(error);
    }
  });

  for (const [id, method] of [
    ["amount", "setAmount"],
    ["wet", "setWet"]
  ]) {
    document.querySelector("#" + id)
      .addEventListener("input", event => {
        try {
          const value = event.target.value;
          fx[method](value);

          document.querySelector("#" + id + "Value")
            .textContent = value;
        } catch (error) {
          status.textContent =
            "Control error: " + error.message;
          console.error(error);
        }
      });
  }

  document.querySelector("#oversample")
    .addEventListener("change", event => {
      try {
        fx.setOversample(event.target.value);

        status.textContent =
          "Oversampling: " + event.target.value;
      } catch (error) {
        status.textContent =
          "Oversampling error: " + error.message;
        console.error(error);
      }
    });

  document.querySelector("#bypass")
    .addEventListener("change", event => {
      fx.setBypass(event.target.checked);

      status.textContent = event.target.checked
        ? "Distortion bypassed."
        : "Distortion active.";
    });

} catch (error) {
  status.textContent =
    "Initialization error: " + error.message;
  play.disabled = true;
  console.error(error);
}
</script>
</body>
</html>
