<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX008 Vibrato</title>
<style>
body {
  background: #17202b;
  color: #f0f3f7;
  font: 16px system-ui;
  max-width: 600px;
  margin: 40px auto;
  padding: 16px;
}
h1 { color: #82cfff; }
label { display: block; margin: 24px 0; }
input[type=range] { width: 100%; }
button {
  padding: 14px 24px;
  font-size: 18px;
  cursor: pointer;
}
#status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX008 — Vibrato</h1>
<p>SymphonyCSV Studio — Effects Laboratory</p>

<button id="play">Play Sustained C4</button>

<label>
  Vibrato Rate:
  <output id="rateValue">5</output> Hz
  <input id="rate" type="range"
    min="0.1" max="12" step="0.1" value="5">
</label>

<label>
  Pitch Modulation Depth:
  <output id="depthValue">0.35</output>
  <input id="depth" type="range"
    min="0" max="1" step="0.05" value="0.35">
</label>

<label>
  Wet Mix:
  <output id="wetValue">0.8</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="0.8">
</label>

<label>
  <input id="bypass" type="checkbox"> Bypass effect
</label>

<p id="status">Audio has not started.</p>

<p>
  Listen for pitch movement rather than volume pulses.
  Try slow vibrato and then faster modulation.
</p>

<script type="module">
import { start, Synth } from "tone";
import { createVibrato } from "../fx008-vibrato.js";

const status = document.querySelector("#status");
const play = document.querySelector("#play");

try {
  const fx = createVibrato();
  fx.node.toDestination();

  const synth = new Synth({
    volume: -24,
    oscillator: { type: "sine" },
    envelope: {
      attack: 0.05,
      decay: 0.1,
      sustain: 0.9,
      release: 0.4
    }
  }).connect(fx.node);

  play.addEventListener("click", async () => {
    try {
      await start();
      synth.triggerAttackRelease("C4", "2m");

      status.textContent =
        "Playing C4. Listen for pitch oscillation.";
    } catch (error) {
      status.textContent = "Audio error: " + error.message;
      console.error(error);
    }
  });

  for (const [id, method] of [
    ["rate", "setRate"],
    ["depth", "setDepth"],
    ["wet", "setWet"]
  ]) {
    document.querySelector("#" + id)
      .addEventListener("input", event => {
        try {
          const value = event.target.value;
          fx[method](value);

          document.querySelector("#" + id + "Value")
            .textContent = value;
        } catch (error) {
          status.textContent = error.message;
          console.error(error);
        }
      });
  }

  document.querySelector("#bypass")
    .addEventListener("change", event => {
      fx.setBypass(event.target.checked);
    });

} catch (error) {
  status.textContent =
    "Initialization error: " + error.message;
  play.disabled = true;
  console.error(error);
}
</script>
</body>
</html>
