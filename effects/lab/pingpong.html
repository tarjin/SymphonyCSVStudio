<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX004 Ping-Pong Delay</title>
<style>
  body {
    background: #17202b;
    color: #f0f3f7;
    font: 16px system-ui;
    max-width: 600px;
    margin: 40px auto;
    padding: 16px;
  }
  h1 { color: #82cfff; }
  label { display: block; margin: 24px 0; }
  input[type=range] { width: 100%; }
  button {
    padding: 14px 24px;
    font-size: 18px;
    cursor: pointer;
  }
  #status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX004 — Ping-Pong Delay</h1>
<p>SymphonyCSV Studio — Stereo Effects Laboratory</p>

<button id="play">Play Test Note (C4)</button>

<label>
  Delay Time:
  <output id="timeValue">0.35</output> seconds
  <input id="time" type="range"
    min="0.1" max="0.9" step="0.05" value="0.35">
</label>

<label>
  Feedback:
  <output id="feedbackValue">0.4</output>
  <input id="feedback" type="range"
    min="0" max="0.85" step="0.05" value="0.4">
</label>

<label>
  Wet Mix:
  <output id="wetValue">0.65</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="0.65">
</label>

<label>
  <input id="bypass" type="checkbox"> Bypass effect
</label>

<p id="status">Audio has not started.</p>
<p>Use stereo headphones to hear alternating echoes.</p>

<script type="module">
  import { start, Synth } from "tone";
  import { createPingPongDelay }
    from "../fx004-ping-pong-delay.js";

  const fx = createPingPongDelay();
  fx.node.toDestination();

  const synth = new Synth({
    volume: -22,
    oscillator: { type: "sawtooth" },
    envelope: {
      attack: 0.01,
      decay: 0.12,
      sustain: 0.15,
      release: 0.18
    }
  }).connect(fx.node);

  const status = document.querySelector("#status");

  document.querySelector("#play")
    .addEventListener("click", async () => {
      try {
        await start();
        synth.triggerAttackRelease("C4", "8n");
        status.textContent =
          "Playing C4. Listen for left-right echoes.";
      } catch (error) {
        status.textContent = "Audio error: " + error.message;
        console.error(error);
      }
    });

  for (const [id, method] of [
    ["time", "setDelay"],
    ["feedback", "setFeedback"],
    ["wet", "setWet"]
  ]) {
    document.querySelector("#" + id)
      .addEventListener("input", (event) => {
        try {
          const value = event.target.value;
          fx[method](value);
          document.querySelector("#" + id + "Value")
            .textContent = value;
        } catch (error) {
          status.textContent = error.message;
        }
      });
  }

  document.querySelector("#bypass")
    .addEventListener("change", (event) => {
      fx.setBypass(event.target.checked);
    });
</script>

</body>
</html>
