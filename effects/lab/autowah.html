<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymphonyCSV Studio - FX012 Auto-Wah</title>
<style>
body {
  background: #17202b;
  color: #f0f3f7;
  font: 16px system-ui;
  max-width: 600px;
  margin: 40px auto;
  padding: 16px;
}
h1 { color: #82cfff; }
label { display: block; margin: 22px 0; }
input[type=range] { width: 100%; }
button {
  padding: 14px 20px;
  margin: 6px;
  font-size: 16px;
  cursor: pointer;
}
#status { color: #a7dbff; }
</style>
</head>
<body>

<h1>FX012 — Auto-Wah</h1>
<p>SymphonyCSV Studio — Dynamic Filter Laboratory</p>

<h2>Play at different velocities</h2>

<button id="soft">Play Soft C4</button>
<button id="strong">Play Strong C4</button>

<label>
  Sensitivity:
  <output id="sensitivityValue">-25</output> dB
  <input id="sensitivity" type="range"
    min="-40" max="0" step="1" value="-25">
</label>

<label>
  Base Frequency:
  <output id="baseValue">150</output> Hz
  <input id="base" type="range"
    min="60" max="800" step="10" value="150">
</label>

<label>
  Sweep Octaves:
  <output id="octavesValue">5</output>
  <input id="octaves" type="range"
    min="1" max="7" step="1" value="5">
</label>

<label>
  Resonance:
  <output id="resonanceValue">6</output>
  <input id="resonance" type="range"
    min="0.5" max="15" step="0.5" value="6">
</label>

<label>
  Wet Mix:
  <output id="wetValue">0.8</output>
  <input id="wet" type="range"
    min="0" max="1" step="0.05" value="0.8">
</label>

<label>
  <input id="bypass" type="checkbox"> Bypass effect
</label>

<p id="status">Audio has not started.</p>

<p>
  Compare soft and strong notes.
  Listen for the filter opening as the
  incoming signal becomes louder.
</p>

<script type="module">
import { start, Synth } from "tone";
import { createAutoWah } from "../fx012-auto-wah.js";

const status = document.querySelector("#status");

try {
  const fx = createAutoWah();
  fx.node.toDestination();

  const synth = new Synth({
    volume: -18,
    oscillator: { type: "sawtooth" },
    envelope: {
      attack: 0.01,
      decay: 0.3,
      sustain: 0.45,
      release: 0.3
    }
  }).connect(fx.node);

  async function playNote(velocity, label) {
    try {
      await start();
      synth.triggerAttackRelease(
        "C4", "2n", undefined, velocity
      );
      status.textContent =
        "Playing " + label + " C4.";
    } catch (error) {
      status.textContent =
        "Audio error: " + error.message;
      console.error(error);
    }
  }

  document.querySelector("#soft")
    .addEventListener("click", () => {
      playNote(0.25, "soft");
    });

  document.querySelector("#strong")
    .addEventListener("click", () => {
      playNote(1.0, "strong");
    });

  for (const [id, method] of [
    ["sensitivity", "setSensitivity"],
    ["base", "setBaseFrequency"],
    ["octaves", "setOctaves"],
    ["resonance", "setResonance"],
    ["wet", "setWet"]
  ]) {
    document.querySelector("#" + id)
      .addEventListener("input", event => {
        try {
          const value = event.target.value;
          fx[method](value);
          document.querySelector("#" + id + "Value")
            .textContent = value;
          status.textContent = "Settings updated.";
        } catch (error) {
          status.textContent =
            "Control error: " + error.message;
          console.error(error);
        }
      });
  }

  document.querySelector("#bypass")
    .addEventListener("change", event => {
      fx.setBypass(event.target.checked);
    });

} catch (error) {
  status.textContent =
    "Initialization error: " + error.message;
  console.error(error);

  document.querySelector("#soft").disabled = true;
  document.querySelector("#strong").disabled = true;
}
</script>
</body>
</html>
