name: Cloudflare service source tests

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "site/**analytics**"
      - "site/feedback/**"
      - "tests/*worker*.test.mjs"
      - "tests/feedback.test.mjs"
      - "tests/feedback_dashboard.test.mjs"
      - "tests/announcements_nps_pin.test.mjs"
      - "site/SymphonyCSV_Announcements*"
      - ".github/workflows/cloudflare-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test aggregate usage Worker
        run: node --test tests/usage-worker.test.mjs
      - name: Test NPS Worker if included
        run: |
          if test -f tests/feedback.test.mjs; then
            node --test tests/feedback.test.mjs
          else
            echo "NPS PR is staged separately."
          fi
      - name: Test staged NPS announcement pinning
        run: |
          if test -f tests/announcements_nps_pin.test.mjs; then
            node --test tests/announcements_nps_pin.test.mjs
          fi
      - name: Test Cloudflare dashboard-ready NPS Worker
        run: |
          if test -f tests/feedback_dashboard.test.mjs; then
            node --test tests/feedback_dashboard.test.mjs
            node --check cloudflare/feedback-worker/dashboard-worker.js
          fi
