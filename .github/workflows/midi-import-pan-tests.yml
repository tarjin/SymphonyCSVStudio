name: MIDI CC10 import regression tests

on:
  pull_request:
    paths:
      - "site/midi-workspace/**"
      - "site/help/**"
      - "tests/midi_import_cc10_pan.test.mjs"
      - ".github/workflows/midi-import-pan-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/midi-workspace/**"
      - "site/help/**"
      - "tests/midi_import_cc10_pan.test.mjs"
      - ".github/workflows/midi-import-pan-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-import-pan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check MIDI import modules
        run: |
          node --check site/midi-workspace/src/midi-core.mjs
          node --check site/midi-workspace/src/drum-schema.mjs
          node --check site/midi-workspace/src/pitched-schema.mjs
      - name: Verify Piano Roll and Drums CC10 imports
        run: node --test tests/midi_import_cc10_pan.test.mjs
